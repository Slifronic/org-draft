<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>How-to stage</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&family=Space+Grotesk:wght@400;500&display=swap">
<!-- The frame for the narrated how-to videos (howto.js): the steps on the left,
     the real site running in a phone on the right, laid out like
     media/demos/homescreen.mp4 so the two can be cut together. 1920x1080. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{background:#eceae6;font-family:'DM Sans',system-ui,sans-serif;color:#1a1a1a;
  background-image:linear-gradient(rgba(138,35,32,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(138,35,32,.045) 1px,transparent 1px);background-size:30px 30px}
#left{position:absolute;left:150px;top:0;width:900px;height:1080px;display:flex;flex-direction:column;justify-content:center}
.eye{font-family:'Space Grotesk',monospace;font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:#4a4744;margin-bottom:26px}
.tag{align-self:flex-start;background:#8a2320;color:#fff;font-family:'Space Grotesk',monospace;font-size:19px;letter-spacing:.14em;text-transform:uppercase;padding:8px 18px;border-radius:999px;margin-bottom:22px}
h1{font-weight:300;font-size:76px;line-height:1;letter-spacing:-.045em;margin-bottom:36px}
ol{list-style:none;border-top:1px solid #d8d4ce}
li{display:flex;gap:22px;align-items:flex-start;padding:13px 0;border-bottom:1px solid #d8d4ce;transition:opacity .35s}
li .n{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid #8a2320;color:#8a2320;display:flex;align-items:center;justify-content:center;font-size:20px;transition:background .3s,color .3s,border-color .3s}
li .t{font-size:29px;line-height:1.25;color:#4a4744;padding-top:3px}
li .t b{color:#1a1a1a;font-weight:700}
li .s{font-size:20px;line-height:1.35;color:#6b6762;margin-top:6px;max-height:0;opacity:0;overflow:hidden;transition:max-height .4s,opacity .4s}
li.on .n{background:#8a2320;color:#fff}
li.on .t{color:#1a1a1a}
li.on .s{max-height:120px;opacity:1}
li.todo .n{border-color:#cfcac3;color:#8d8882}
li.todo .t{color:#8d8882}
li.done .n{background:transparent}
#phone{position:absolute;left:1250px;top:78px;width:424px;height:924px;border-radius:66px;background:#1d1d1f;padding:17px;box-shadow:0 30px 80px rgba(0,0,0,.16),inset 0 0 0 2px #3a3a3c}
#screen{position:relative;width:390px;height:890px;border-radius:50px;overflow:hidden;background:#edebe7}
#status{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 40px;font:600 17px -apple-system,'SF Pro Text',system-ui,sans-serif;color:#1a1a1a;background:#edebe7}
#island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:3}
#app{display:block;width:390px;height:840px;border:0;background:#edebe7}
#tap{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(26,26,26,.28);border:2px solid rgba(255,255,255,.9);
  box-shadow:0 2px 10px rgba(0,0,0,.25);pointer-events:none;opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s,left .45s cubic-bezier(.4,0,.2,1),top .45s cubic-bezier(.4,0,.2,1);z-index:5}
#tap.show{opacity:1;transform:scale(1)}
#tap.down{transform:scale(.78);background:rgba(138,35,32,.42)}
#card{position:absolute;inset:0;z-index:10;display:flex;align-items:center;padding-left:150px;opacity:0;pointer-events:none;transition:opacity .6s;
  background:#eceae6;background-image:inherit;background-size:30px 30px}
#card.on{opacity:1}
#card .mark{width:72px;height:72px;border-radius:16px;background:#8a2320;display:flex;align-items:center;justify-content:center;margin-bottom:26px}
#card .big{font-weight:300;font-size:104px;letter-spacing:-.045em;line-height:1}
#card .line{font-size:30px;color:#4a4744;margin-top:22px;max-width:1300px;line-height:1.4}
#card .line b{color:#1a1a1a}
#card .code{display:inline-block;font-family:'Space Grotesk',monospace;font-size:44px;letter-spacing:.08em;border:2px solid #8a2320;color:#8a2320;border-radius:14px;padding:8px 22px;margin-top:30px}
#card .foot{display:flex;gap:44px;margin-top:40px;font-size:21px;color:#6b6762}
</style></head>
<body>
<div id="left">
  <div class="eye" id="eye">De Anza PBL · The Org System</div>
  <div class="tag" id="tag">New members</div>
  <h1 id="title">Join the<br>Org System</h1>
  <ol id="steps"></ol>
</div>
<div id="phone"><div id="screen">
  <div id="island"></div>
  <div id="status"><span>9:41</span><span style="letter-spacing:2px">●●● ▮</span></div>
  <iframe id="app" title="The Org System"></iframe>
  <div id="tap"></div>
</div></div>
<div id="card"></div>
<script>
var $=function(id){return document.getElementById(id)};
window.stage={
  setup:function(o){
    $('eye').textContent=o.eyebrow||'De Anza PBL · The Org System';
    $('tag').textContent=o.tag||''; $('tag').style.display=o.tag?'':'none';
    $('title').innerHTML=o.title;
    $('steps').innerHTML=o.steps.map(function(s,i){
      return '<li class="todo"><span class="n">'+(i+1)+'</span><div><div class="t">'+s.t+'</div><div class="s">'+(s.sub||'')+'</div></div></li>'}).join('');
  },
  step:function(i){
    Array.prototype.forEach.call(document.querySelectorAll('#steps li'),function(li,k){
      li.className=k<i?'done':k===i?'on':'todo'});
  },
  load:function(url){
    return new Promise(function(res){var f=$('app');f.onload=function(){res()};f.src=url});
  },
  /* x, y in page pixels, as Playwright reports them for the frame's elements */
  tapAt:function(x,y,show){
    var sc=$('screen').getBoundingClientRect(), t=$('tap');
    t.style.left=(x-sc.left)+'px'; t.style.top=(y-sc.top)+'px';
    if(show)t.classList.add('show');
  },
  press:function(on){$('tap').classList.toggle('down',!!on)},
  tapHide:function(){$('tap').classList.remove('show','down')},
  card:function(html){var c=$('card');c.innerHTML='<div>'+html+'</div>';c.classList.add('on')}
};
</script>
</body></html>
