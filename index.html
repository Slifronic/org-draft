<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Org System dashboard: members, SFBLC schedule, coaching, teams and messages.">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/org-apple-touch-icon.png">
<link rel="manifest" href="/icons/org.webmanifest">
<script>
/* The theme is set before the stylesheet paints. The dashboard wears the
   chapter site (deanzapbl.com) unless someone picks another look. */
(function(){var d=document.documentElement,g=function(k){try{return localStorage.getItem(k)}catch(e){return null}};
  var t=g('orgsystem.dash.theme')||'phi'; if(['phi','phi-light','dark','light'].indexOf(t)<0)t='phi';
  /* The chapter's own address always wears the chapter's look and home-screen icon. */
  if(location.hostname==='org.deanzapbl.com'){t='phi';
    var mf=document.querySelector('link[rel=manifest]'),ti=document.querySelector('link[rel=apple-touch-icon]');
    if(mf)mf.href='/icons/pbl.webmanifest'; if(ti)ti.href='/icons/pbl-apple-touch-icon.png';}
  d.setAttribute('data-theme',t);
  var z=g('orgsystem.dash.size'); if(z==='l'||z==='xl')d.setAttribute('data-size',z);
  var m=g('orgsystem.dash.motion')||((window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)?'calm':'full');
  d.setAttribute('data-motion',m);})();
</script>
<title>The Org System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
